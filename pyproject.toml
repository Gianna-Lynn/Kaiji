[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiji-agent"
version = "0.1.0"
description = "A small, framework-free single-agent runtime for learning reliable tool calling."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
