[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiji-agent"
version = "0.1.0"
description = "A reliable, recoverable, and evaluable single-agent runtime with typed tool calling."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.116,<1",
    "pytest>=8,<10",
]
service = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.kaiji-pytest-tmp"
cache_dir = ".kaiji-pytest-cache"
